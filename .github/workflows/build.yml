name: Build APK

# Build a release APK on every push to main and make it downloadable as an
# artifact. Also runnable manually from the Actions tab.
on:
  push:
    # Builds on main (the real releases) and on claude/* feature branches so
    # changes can be verified via CI before merging.
    branches: [main, "claude/**"]
  workflow_dispatch:

# versionCode must always increase for Android to allow install-over-update.
# We derive it from the GitHub run number, which monotonically increases.
env:
  FLUTTER_VERSION: "3.27.4"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      # Generate the Android platform scaffold (incl. the binary Gradle wrapper).
      # We keep this OUT of git and regenerate it here so builds are reproducible.
      - name: Generate Android project
        run: flutter create --platforms=android --org com.anchorly .

      # Swap in our signing-aware build.gradle and set the app's display name.
      - name: Apply custom Android config
        run: |
          cp ci/app_build.gradle android/app/build.gradle
          sed -i 's/android:label="anchorly"/android:label="Anchorly"/' \
            android/app/src/main/AndroidManifest.xml

      # Write release signing config only if the keystore secret is present.
      # Without it, the release build falls back to debug signing (installable,
      # but updates won't be seamless — see README).
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Strip any whitespace/newlines/CR the pasted secret may carry —
            # GNU base64 -d errors ("invalid input") on characters like \r.
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$PWD/android/app/keystore.jks"
            # Fail fast with a clear message if the keystore didn't decode.
            if ! keytool -list -keystore "$PWD/android/app/keystore.jks" \
                 -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::KEYSTORE_BASE64 did not decode into a valid keystore, or KEYSTORE_PASSWORD is wrong. Re-copy the full contents of anchorly-release.jks.b64 and check the password."
              exit 1
            fi
            cat > "$PWD/android/key.properties" <<EOF
          storeFile=$PWD/android/app/keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
            echo "Release signing configured."
          else
            echo "No KEYSTORE_BASE64 secret found — building a debug-signed release APK."
          fi

      - name: Get dependencies
        run: flutter pub get

      # Work around a bug in the transitive dep quill_native_bridge_windows
      # 0.0.2 (pulled by flutter_quill): its Dart is compiled even for Android
      # and references the bare `GMEM_MOVEABLE`, which newer `win32` moved into
      # the GLOBAL_ALLOC_FLAGS enum. This applies the maintainers' confirmed
      # one-line fix to the cached file. Guarded so it only runs when needed.
      # See: https://github.com/singerdmx/flutter-quill/issues/2612
      - name: Patch quill_native_bridge_windows (GMEM_MOVEABLE)
        run: |
          f="$(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*quill_native_bridge_windows*/lib/quill_native_bridge_windows.dart' 2>/dev/null | head -1)"
          if [ -n "$f" ] && grep -q 'GlobalAlloc(GMEM_MOVEABLE' "$f"; then
            sed -i 's/GlobalAlloc(GMEM_MOVEABLE,/GlobalAlloc(GLOBAL_ALLOC_FLAGS.GMEM_MOVEABLE,/g' "$f"
            echo "Patched $f"
          else
            echo "No patch needed (file: ${f:-not found})"
          fi

      # Generate drift database code (and any other *.g.dart).
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      # --build-number sets the Android versionCode from the run number so it
      # always increases across builds.
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/anchorly-v1.0.0-build${{ github.run_number }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anchorly-apk
          path: dist/*.apk
          if-no-files-found: error
